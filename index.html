<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOEIC Speaking 重点复习</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172026;
      --muted: #60707c;
      --line: #dfe5ea;
      --teal: #007f7a;
      --teal-dark: #005f5b;
      --amber: #a56500;
      --coral: #bc4b3f;
      --indigo: #4153a4;
      --green-soft: #e7f5f2;
      --amber-soft: #fff3df;
      --coral-soft: #ffefed;
      --shadow: 0 12px 30px rgba(23, 32, 38, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    button, input, select {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px;
      background: #eef3f6;
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    main {
      min-width: 0;
      padding: 22px;
    }

    .brand {
      display: grid;
      gap: 6px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .control-block {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: #43525d;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .part-list,
    .priority-list {
      display: grid;
      gap: 8px;
    }

    .part-button,
    .priority-button,
    .tool-button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .part-button {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      text-align: left;
    }

    .part-button:hover,
    .priority-button:hover,
    .tool-button:hover {
      transform: translateY(-1px);
      border-color: #aebcc6;
    }

    .part-button.active {
      border-color: var(--teal);
      background: var(--green-soft);
    }

    .part-title {
      font-weight: 750;
      font-size: 14px;
    }

    .part-count {
      color: var(--muted);
      font-size: 12px;
    }

    .priority-list {
      grid-template-columns: repeat(4, 1fr);
    }

    .priority-button {
      padding: 8px 6px;
      font-weight: 750;
      font-size: 13px;
      text-align: center;
    }

    .priority-button.active[data-priority="all"] { border-color: var(--indigo); background: #edf0ff; color: var(--indigo); }
    .priority-button.active[data-priority="P1"] { border-color: var(--teal); background: var(--green-soft); color: var(--teal-dark); }
    .priority-button.active[data-priority="P2"] { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
    .priority-button.active[data-priority="P3"] { border-color: var(--coral); background: var(--coral-soft); color: var(--coral); }

    .search-box {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 127, 122, 0.12);
    }

    .sidebar-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      text-align: left;
    }

    button.stat {
      cursor: pointer;
    }

    button.stat:hover {
      border-color: #9aabb5;
    }

    button.stat.active {
      border-color: var(--teal);
      background: var(--green-soft);
      color: var(--teal-dark);
    }

    .stat-value {
      display: block;
      font-size: 20px;
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .current-title {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .current-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .tool-button {
      padding: 9px 12px;
      font-weight: 700;
      font-size: 13px;
    }

    .countdown-control {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .countdown-toggle {
      appearance: none;
      gap: 4px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .countdown-toggle:hover {
      border-color: #9aabb5;
      background: #edf1f4;
    }

    .countdown-toggle.running {
      border-color: var(--teal);
      background: var(--green-soft);
      color: var(--teal-dark);
    }

    .countdown-control.answer .countdown-toggle.running {
      border-color: var(--amber);
      background: var(--amber-soft);
      color: #8a5200;
    }

    .countdown-toggle.expired {
      border-color: #e7aaa4;
      background: var(--coral-soft);
      color: var(--coral);
    }

    .countdown-icon {
      min-width: 9px;
      font-size: 10px;
      line-height: 1;
      text-align: center;
    }

    .countdown-reset {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fbfcfd;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .countdown-reset:hover {
      border-color: #9aabb5;
      color: var(--text);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-item {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }

    .summary-number {
      display: block;
      font-size: 24px;
      font-weight: 850;
      line-height: 1.1;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
    }

    .card-list {
      display: grid;
      gap: 12px;
    }

    .question-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 260px);
      gap: 16px;
      padding: 16px;
    }

    .card-main.no-image {
      grid-template-columns: minmax(0, 1fr);
    }

    .card-main.part2-image-left {
      grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
    }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .badge.p1 { background: var(--green-soft); color: var(--teal-dark); border-color: #9ed8cf; }
    .badge.p2 { background: var(--amber-soft); color: var(--amber); border-color: #e7c27c; }
    .badge.p3 { background: var(--coral-soft); color: var(--coral); border-color: #e7aaa4; }
    .badge.meta { background: #f3f5f7; color: #475864; border-color: var(--line); }

    .card-topic {
      font-size: 18px;
      font-weight: 820;
      margin: 0 0 8px;
      letter-spacing: 0;
    }

    .question-text,
    .answer-text,
    .material-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .question-text {
      margin: 0;
      color: #1f2a31;
      font-size: 15px;
    }

    .question-group {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .group-question {
      padding: 14px 0;
    }

    .group-question + .group-question {
      border-top: 1px solid var(--line);
    }

    .group-question-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .group-question-topic {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .group-answer {
      margin-top: 10px;
      padding: 10px 12px;
      border-left: 4px solid var(--teal);
      background: #f4fbf9;
    }

    .group-answer .answer-text {
      margin-bottom: 0;
    }

    .part3-q3-answer {
      padding: 0;
      overflow: hidden;
    }

    .material {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      overflow: hidden;
    }

    .material summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 800;
      color: #354650;
    }

    .material-scroll {
      border-top: 1px solid var(--line);
      overflow-x: auto;
    }

    .material-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      color: #273942;
      font-size: 13px;
      line-height: 1.4;
    }

    .material-table th,
    .material-table td {
      min-width: 112px;
      max-width: 260px;
      padding: 9px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      word-break: normal;
      overflow-wrap: anywhere;
    }

    .material-table th {
      background: #eaf3f2;
      color: #29413f;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .material-table tr:last-child td {
      border-bottom: 0;
    }

    .material-table th:last-child,
    .material-table td:last-child {
      border-right: 0;
    }

    .material-table tr.changed td {
      color: #7a3730;
      background: #fff2f0;
    }

    .material-notes {
      margin: 0;
      padding: 9px 12px;
      border-top: 1px solid var(--line);
      color: #475a64;
      font-size: 12px;
    }

    .material-missing {
      padding: 11px 12px;
      color: #7a4b00;
      background: #fff8e8;
      font-size: 13px;
    }

    .answer-panel {
      margin-top: 12px;
      border-left: 4px solid var(--teal);
      background: #f4fbf9;
      border-radius: 0 8px 8px 0;
      padding: 12px;
    }

    .answer-title {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--teal-dark);
      font-weight: 850;
    }

    .answer-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .answer-heading .answer-title {
      margin: 0;
    }

    .answer-text {
      margin: 0;
      color: #18343a;
      font-size: 14px;
    }

    .part2-answer-panel {
      padding: 0;
      overflow: hidden;
    }

    .part2-answer-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #cde6e1;
    }

    .part2-answer-heading .answer-title {
      margin: 0;
    }

    .part2-answer-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 12px;
      background: #ffffff;
    }

    .part2-answer-row + .part2-answer-row {
      border-top: 1px solid #dcebe8;
    }

    .part2-answer-row.detail {
      background: #f7fafb;
    }

    .part2-step-label {
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .part2-step-text {
      margin: 0;
      color: #18343a;
      font-size: 14px;
    }

    .part5-answer-panel {
      padding: 0;
      overflow: hidden;
    }

    .part5-answer-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #cde6e1;
    }

    .part5-answer-heading .answer-title {
      margin: 0;
    }

    .answer-pattern {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid #9ed8cf;
      border-radius: 999px;
      background: #ffffff;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .part5-language + .part5-language {
      border-top: 1px solid #cde6e1;
      background: #fbfcfd;
    }

    .part5-language-title {
      margin: 0;
      padding: 10px 12px 6px;
      color: #344750;
      font-size: 13px;
      font-weight: 850;
    }

    .part5-language-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px 4px;
    }

    .part5-language-heading .part5-language-title {
      padding: 0;
    }

    .part5-english-toggle-row {
      display: flex;
      justify-content: flex-end;
      padding: 10px 12px 12px;
      border-top: 1px solid #cde6e1;
    }

    .part5-english-toggle-row + .part5-language {
      border-top: 1px solid #cde6e1;
      background: #fbfcfd;
    }

    .part5-answer-row {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 12px;
    }

    .part5-answer-row + .part5-answer-row {
      border-top: 1px solid rgba(205, 230, 225, 0.72);
    }

    .part5-step-label {
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .part5-step-text {
      margin: 0;
      color: #18343a;
      font-size: 14px;
    }

    .annotated-answer {
      display: block;
      padding: 12px;
      border: 1px solid #bfe0dc;
      border-radius: 8px;
      background: #ffffff;
      font-size: 16px;
      line-height: 1.9;
    }

    .annotated-answer strong {
      color: #003d3a;
      font-weight: 900;
      background: #dff4ef;
      border-radius: 5px;
      padding: 0 3px;
    }

    .pause-mark {
      display: inline-block;
      min-width: 18px;
      color: var(--amber);
      font-weight: 900;
      text-align: center;
    }

    .tone-mark {
      display: inline-block;
      margin-left: 3px;
      font-weight: 900;
      font-size: 17px;
    }

    .tone-rise { color: var(--indigo); }
    .tone-fall { color: var(--teal-dark); }

    .reading-note {
      margin: 8px 0 0;
      color: #52636e;
      font-size: 12px;
    }

    .speech-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .speech-controls .tool-button {
      background: #ffffff;
    }

    .compact-speech-controls {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .compact-speech-controls .tool-button {
      min-height: 30px;
      padding: 4px 9px;
      background: #ffffff;
      color: var(--teal-dark);
    }

    .speech-status {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .speech-status.warning {
      color: var(--amber);
      font-weight: 800;
    }

    .speech-status.error {
      color: var(--coral);
      font-weight: 800;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .card-actions .tool-button {
      background: #fbfcfd;
    }

    .card-actions .tool-button.done {
      border-color: var(--teal);
      background: var(--green-soft);
      color: var(--teal-dark);
    }

    .card-actions .tool-button.personalized {
      border-color: var(--amber);
      background: var(--amber-soft);
      color: #8a5200;
    }

    .image-wrap {
      align-self: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #f6f7f8;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .reason {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      border: 1px dashed #bac6ce;
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      background: var(--panel);
      text-align: center;
    }

    .mobile-tabs {
      display: none;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #eef3f6;
      border-bottom: 1px solid var(--line);
      padding: 10px;
      gap: 8px;
    }

    .mobile-tabs select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel);
      color: var(--text);
    }

    @media (max-width: 900px) {
      .app-shell {
        display: block;
      }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main {
        padding: 14px;
      }
      .part-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .topbar {
        grid-template-columns: 1fr;
      }
      .tools {
        justify-content: flex-start;
      }
      .summary-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .card-main,
      .card-main.part2-image-left {
        grid-template-columns: 1fr;
      }
      .image-wrap img {
        aspect-ratio: 16 / 9;
      }
    }

    @media (max-width: 560px) {
      aside {
        padding: 14px;
      }
      .part-list {
        grid-template-columns: 1fr;
      }
      .priority-list {
        grid-template-columns: repeat(2, 1fr);
      }
      .summary-strip {
        grid-template-columns: 1fr;
      }
      .current-title {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside>
      <div class="brand">
        <h1>TOEIC Speaking 重点复习</h1>
        <div class="subtitle">Part1-5 按 P1/P2/P3 排序，含题目、答案、图片和资料表。</div>
      </div>

      <section class="control-block">
        <div class="label">Part</div>
        <div class="part-list" id="partList"></div>
      </section>

      <section class="control-block">
        <div class="label">优先级</div>
        <div class="priority-list" id="priorityList">
          <button class="priority-button active" type="button" data-priority="all">全部</button>
          <button class="priority-button" type="button" data-priority="P1">P1</button>
          <button class="priority-button" type="button" data-priority="P2">P2</button>
          <button class="priority-button" type="button" data-priority="P3">P3</button>
        </div>
      </section>

      <section class="control-block">
        <label class="label" for="searchInput">搜索</label>
        <input id="searchInput" class="search-box" type="search" placeholder="主题、题目、答案、来源" />
      </section>

      <div class="sidebar-stats">
        <button class="stat active" type="button" data-study-filter="all"><span class="stat-value" id="totalCount">0</span><span class="stat-label">当前题数</span></button>
        <button class="stat" type="button" data-study-filter="done"><span class="stat-value" id="doneCount">0</span><span class="stat-label">已练</span></button>
        <button class="stat" type="button" data-study-filter="undone"><span class="stat-value" id="undoneCount">0</span><span class="stat-label">未练</span></button>
        <button class="stat" type="button" data-study-filter="personalized"><span class="stat-value" id="personalizedCount">0</span><span class="stat-label">个性化</span></button>
        <div class="stat"><span class="stat-value" id="shownCount">0</span><span class="stat-label">显示</span></div>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <div>
          <h2 class="current-title" id="currentTitle">Part 1 朗读短文</h2>
          <div class="current-meta" id="currentMeta"></div>
        </div>
        <div class="tools">
          <button class="tool-button" type="button" id="toggleAnswers">显示全部答案</button>
          <button class="tool-button" type="button" id="shuffleButton">随机排序</button>
          <button class="tool-button" type="button" id="resetDone">清除已练</button>
        </div>
      </div>

      <section class="summary-strip" id="summaryStrip"></section>
      <section class="card-list" id="cardList"></section>
    </main>
  </div>

  <script src="./toeic_review_data.js"></script>
  <script>
    const data = window.TOEIC_REVIEW_DATA;
    const state = {
      part: 1,
      priority: "all",
      studyFilter: "all",
      search: "",
      showAllAnswers: false,
      shuffled: false,
      shuffleSeed: "",
      answerOpen: new Set(),
      part3EnglishOpen: new Set(),
      part5EnglishOpen: new Set(),
      done: new Set(JSON.parse(localStorage.getItem("toeic-review-done") || "[]")),
      personalized: new Set(JSON.parse(localStorage.getItem("toeic-review-personalized") || "[]")),
    };

    const $ = (id) => document.getElementById(id);
    const partList = $("partList");
    const priorityList = $("priorityList");
    const searchInput = $("searchInput");
    const cardList = $("cardList");
    const summaryStrip = $("summaryStrip");
    const countdownTimers = new Map();
    const readingFunctionWords = new Set([
      "a", "an", "the", "and", "but", "or", "nor", "so", "yet",
      "as", "at", "by", "for", "from", "in", "into", "of", "on", "onto",
      "per", "than", "through", "to", "up", "with", "within", "without",
      "about", "above", "after", "before", "behind", "below", "beside", "between",
      "during", "near", "over", "under", "across", "around", "among", "along",
      "against", "toward", "towards", "via",
      "am", "is", "are", "was", "were", "be", "been", "being",
      "do", "does", "did", "have", "has", "had", "having",
      "can", "could", "may", "might", "must", "shall", "should", "will", "would",
      "i", "me", "my", "mine", "we", "us", "our", "ours", "you", "your", "yours",
      "he", "him", "his", "she", "her", "hers", "it", "its", "they", "them", "their", "theirs",
      "this", "that", "these", "those", "who", "whom", "whose", "which", "what",
      "when", "where", "why", "how", "there", "here", "if", "then", "because",
      "although", "though", "while", "whether"
    ]);
    const readingAlwaysStressWords = new Set(["no", "not", "never", "please", "welcome", "attention"]);
    let speechUtterance = null;
    let speechKeepAliveTimer = 0;
    let voicesReadyPromise = null;
    let countdownAudioContext = null;

    function saveDone() {
      localStorage.setItem("toeic-review-done", JSON.stringify([...state.done]));
    }

    function savePersonalized() {
      localStorage.setItem("toeic-review-personalized", JSON.stringify([...state.personalized]));
    }

    function ensureCountdownTimer(key, durationSeconds, type) {
      const normalizedDuration = Math.max(1, Math.round(Number(durationSeconds) || 1));
      if (!countdownTimers.has(key)) {
        countdownTimers.set(key, {
          durationSeconds: normalizedDuration,
          remainingMs: normalizedDuration * 1000,
          endAt: 0,
          running: false,
          alerted: false,
          lastTickSecond: normalizedDuration,
          type,
        });
      }
      return countdownTimers.get(key);
    }

    function prepareCountdownAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!countdownAudioContext || countdownAudioContext.state === "closed") {
        countdownAudioContext = new AudioContextClass();
      }
      if (countdownAudioContext.state === "suspended") countdownAudioContext.resume().catch(() => {});
    }

    function playCountdownAlert(type) {
      if (!countdownAudioContext || countdownAudioContext.state === "closed") return;
      if (countdownAudioContext.state === "suspended") countdownAudioContext.resume().catch(() => {});
      const startAt = countdownAudioContext.currentTime;
      const baseFrequency = type === "answer" ? 1040 : 820;
      [0, 0.16, 0.32, 0.64, 0.8, 0.96, 1.28].forEach((offset, index) => {
        const oscillator = countdownAudioContext.createOscillator();
        const gain = countdownAudioContext.createGain();
        oscillator.type = "triangle";
        oscillator.frequency.value = index % 2 === 0 ? baseFrequency : baseFrequency * 1.22;
        gain.gain.setValueAtTime(0.0001, startAt + offset);
        gain.gain.exponentialRampToValueAtTime(0.34, startAt + offset + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + offset + 0.13);
        oscillator.connect(gain);
        gain.connect(countdownAudioContext.destination);
        oscillator.start(startAt + offset);
        oscillator.stop(startAt + offset + 0.14);
      });
      document.documentElement.dataset.countdownAlert = (type || "timer") + "-" + Date.now();
    }

    function playCountdownTick(type, remainingSeconds) {
      if (!countdownAudioContext || countdownAudioContext.state !== "running") return;
      const startAt = countdownAudioContext.currentTime;
      const baseFrequency = type === "answer" ? 1080 : 900;
      const oscillator = countdownAudioContext.createOscillator();
      const gain = countdownAudioContext.createGain();
      oscillator.type = "square";
      oscillator.frequency.value = remainingSeconds % 2 === 0 ? baseFrequency * 1.24 : baseFrequency;
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(0.17, startAt + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.055);
      oscillator.connect(gain);
      gain.connect(countdownAudioContext.destination);
      oscillator.start(startAt);
      oscillator.stop(startAt + 0.06);
      document.documentElement.dataset.countdownTick = (type || "timer") + "-" + remainingSeconds + "-" + Date.now();
    }

    function syncCountdownTimer(timer, now = Date.now()) {
      if (!timer.running) return;
      timer.remainingMs = Math.max(0, timer.endAt - now);
      const remainingSeconds = countdownSeconds(timer);
      if (remainingSeconds > 0 && remainingSeconds !== timer.lastTickSecond) {
        timer.lastTickSecond = remainingSeconds;
        playCountdownTick(timer.type, remainingSeconds);
      }
      if (timer.remainingMs === 0) {
        timer.running = false;
        timer.endAt = 0;
        timer.lastTickSecond = 0;
        if (!timer.alerted) {
          timer.alerted = true;
          playCountdownAlert(timer.type);
        }
      }
    }

    function countdownSeconds(timer) {
      return Math.max(0, Math.ceil(timer.remainingMs / 1000));
    }

    function countdownAction(timer, label) {
      if (timer.running) return "暂停" + label + "倒计时";
      if (timer.remainingMs <= 0) return "重新开始" + label + "倒计时";
      if (timer.remainingMs < timer.durationSeconds * 1000) return "继续" + label + "倒计时";
      return "开始" + label + "倒计时";
    }

    function renderCountdown(durationSeconds, key, label, type) {
      const timer = ensureCountdownTimer(key, durationSeconds, type);
      syncCountdownTimer(timer);
      const expired = timer.remainingMs <= 0;
      const stateClass = timer.running ? " running" : expired ? " expired" : "";
      const icon = timer.running ? "Ⅱ" : expired ? "↻" : "▶";
      const action = countdownAction(timer, label);
      return '<span class="countdown-control ' + escapeAttr(type) + '">' +
        '<button class="badge meta countdown-toggle' + stateClass + '" type="button" data-countdown-toggle="' + escapeAttr(key) + '" data-countdown-label="' + escapeAttr(label) + '" title="' + escapeAttr(action) + '" aria-label="' + escapeAttr(action) + '">' +
          '<span>' + escapeHtml(label) + ' </span>' +
          '<span data-countdown-value>' + countdownSeconds(timer) + 's</span>' +
          '<span class="countdown-icon" data-countdown-icon>' + icon + '</span>' +
        '</button>' +
        '<button class="countdown-reset" type="button" data-countdown-reset="' + escapeAttr(key) + '" data-countdown-label="' + escapeAttr(label) + '" title="重置' + escapeAttr(label) + '倒计时" aria-label="重置' + escapeAttr(label) + '倒计时">↻</button>' +
      '</span>';
    }

    function updateCountdownDisplay(key) {
      const timer = countdownTimers.get(key);
      if (!timer) return;
      const expired = timer.remainingMs <= 0;
      document.querySelectorAll("[data-countdown-toggle]").forEach((button) => {
        if (button.dataset.countdownToggle !== key) return;
        const label = button.dataset.countdownLabel || "计时";
        const value = button.querySelector("[data-countdown-value]");
        const icon = button.querySelector("[data-countdown-icon]");
        if (value) value.textContent = countdownSeconds(timer) + "s";
        if (icon) icon.textContent = timer.running ? "Ⅱ" : expired ? "↻" : "▶";
        button.classList.toggle("running", timer.running);
        button.classList.toggle("expired", expired);
        const action = countdownAction(timer, label);
        button.title = action;
        button.setAttribute("aria-label", action);
      });
    }

    function updateAllCountdowns() {
      const now = Date.now();
      countdownTimers.forEach((timer, key) => {
        syncCountdownTimer(timer, now);
        updateCountdownDisplay(key);
      });
    }

    function toggleCountdown(key) {
      const timer = countdownTimers.get(key);
      if (!timer) return;
      syncCountdownTimer(timer);
      if (timer.running) {
        timer.running = false;
        timer.endAt = 0;
      } else {
        prepareCountdownAudio();
        if (timer.remainingMs <= 0) timer.remainingMs = timer.durationSeconds * 1000;
        timer.alerted = false;
        timer.lastTickSecond = countdownSeconds(timer);
        timer.running = true;
        timer.endAt = Date.now() + timer.remainingMs;
      }
      updateCountdownDisplay(key);
    }

    function resetCountdown(key) {
      const timer = countdownTimers.get(key);
      if (!timer) return;
      timer.running = false;
      timer.endAt = 0;
      timer.remainingMs = timer.durationSeconds * 1000;
      timer.alerted = false;
      timer.lastTickSecond = timer.durationSeconds;
      updateCountdownDisplay(key);
    }

    function normalize(value) {
      return String(value || "").toLowerCase();
    }

    function currentRecords() {
      const term = normalize(state.search).trim();
      let records = data.records.filter((record) => {
        if (record.part !== state.part) return false;
        if (state.priority !== "all" && record.priority !== state.priority) return false;
        if (state.studyFilter === "done" && !state.done.has(record.uid)) return false;
        if (state.studyFilter === "undone" && state.done.has(record.uid)) return false;
        if (state.studyFilter === "personalized" && !state.personalized.has(record.uid)) return false;
        if (!term) return true;
        return [
          record.topic,
          record.prompt,
          record.answer,
          record.answerZh,
          record.sourceFile,
          record.bankName,
          record.instructions,
        ].some((field) => normalize(field).includes(term));
      });
      if (state.shuffled) {
        records = [...records].sort((a, b) => {
          const ah = hash(a.uid + "-" + state.part + "-" + state.priority + "-" + state.shuffleSeed);
          const bh = hash(b.uid + "-" + state.part + "-" + state.priority + "-" + state.shuffleSeed);
          return ah - bh;
        });
      }
      return records;
    }

    function hash(text) {
      let value = 2166136261;
      for (let i = 0; i < text.length; i += 1) {
        value ^= text.charCodeAt(i);
        value = Math.imul(value, 16777619);
      }
      return value >>> 0;
    }

    function createShuffleSeed() {
      const values = new Uint32Array(2);
      if (window.crypto?.getRandomValues) window.crypto.getRandomValues(values);
      else {
        values[0] = Math.floor(Math.random() * 0x100000000);
        values[1] = Math.floor(Math.random() * 0x100000000);
      }
      return Date.now() + "-" + values[0] + "-" + values[1];
    }

    function renderAnswer(record) {
      const answerText = record.answer || "题库未提供参考答案。";
      if (record.part === 2 && record.part2Answer) {
        return renderPart2Answer(record);
      }
      if (record.part === 5 && record.answerSectionsEn && record.answerSectionsZh) {
        return renderPart5Answer(record);
      }
      if (record.part !== 1) {
        return '<div class="answer-panel">' +
          '<div class="answer-heading">' +
            '<p class="answer-title">英文参考答案</p>' +
            renderCompactSpeechControl(record) +
          '</div>' +
          '<p class="answer-text">' + escapeHtml(answerText) + '</p>' +
        '</div>';
      }
      return '<div class="answer-panel part1-answer-panel">' +
        '<div class="answer-heading">' +
          '<p class="answer-title">参考答案 · 朗读标注</p>' +
          '<span class="speech-status" data-speech-status="' + escapeAttr(record.uid) + '">检测中</span>' +
        '</div>' +
        '<p class="answer-text annotated-answer">' + annotatePart1Answer(answerText) + '</p>' +
        '<p class="reading-note">标注：/ 短停顿，// 句间停顿；粗体表示建议重读的实义词、数字和否定词；↑ 表示列举、引导或未完意群继续，↓ 表示陈述句收束。</p>' +
        '<div class="speech-controls">' +
          '<button class="tool-button speech-check-button" type="button" data-check-speech="' + escapeAttr(record.uid) + '">检测声音</button>' +
          '<button class="tool-button speech-button" type="button" data-speak="' + escapeAttr(record.uid) + '">播放朗读</button>' +
          '<button class="tool-button speech-pause-button" type="button" data-pause-speech="' + escapeAttr(record.uid) + '">暂停/继续</button>' +
          '<button class="tool-button speech-stop-button" type="button" data-stop-speech="' + escapeAttr(record.uid) + '">停止</button>' +
        '</div>' +
      '</div>';
    }

    function renderPart2Answer(record) {
      const detailRows = record.part2Answer.details.map((sentence, index) =>
        '<div class="part2-answer-row detail">' +
          '<span class="part2-step-label">分 · 细节 ' + (index + 1) + '</span>' +
          '<p class="part2-step-text">' + escapeHtml(sentence) + '</p>' +
        '</div>'
      ).join("");
      return '<div class="answer-panel part2-answer-panel">' +
        '<div class="part2-answer-heading">' +
          '<p class="answer-title">英文参考答案 · 总—分—总</p>' +
          renderCompactSpeechControl(record) +
        '</div>' +
        '<div class="part2-answer-row">' +
          '<span class="part2-step-label">总 · 概述</span>' +
          '<p class="part2-step-text">' + escapeHtml(record.part2Answer.opening) + '</p>' +
        '</div>' +
        detailRows +
        '<div class="part2-answer-row">' +
          '<span class="part2-step-label">总 · 总结</span>' +
          '<p class="part2-step-text">' + escapeHtml(record.part2Answer.conclusion) + '</p>' +
        '</div>' +
      '</div>';
    }

    function renderCompactSpeechControl(record) {
      return '<div class="compact-speech-controls">' +
        '<span class="speech-status" data-speech-status="' + escapeAttr(record.uid) + '">检测中</span>' +
        '<button class="tool-button speech-button" type="button" data-speak="' + escapeAttr(record.uid) + '" title="播放英文参考答案" aria-label="播放英文参考答案">播放答案</button>' +
      '</div>';
    }

    function renderPart5Answer(record) {
      const englishVisible = state.part5EnglishOpen.has(record.uid);
      const labels = record.answerPattern === "2R1E"
        ? ["观点", "理由 1", "理由 2", "例子", "总结"]
        : ["观点", "理由 1", "理由 2", "理由 3", "总结"];
      const patternText = record.answerPattern === "2R1E"
        ? "观点 + 2 个理由 + 1 个例子 + 总结"
        : "观点 + 3 个理由 + 总结";
      const renderRows = (sections) => sections.map((section, index) =>
        '<div class="part5-answer-row">' +
          '<span class="part5-step-label">' + escapeHtml(labels[index] || "要点") + '</span>' +
          '<p class="part5-step-text">' + escapeHtml(section) + '</p>' +
        '</div>'
      ).join("");
      return '<div class="answer-panel part5-answer-panel">' +
        '<div class="part5-answer-heading">' +
          '<p class="answer-title">Part 5 双语参考答案</p>' +
          '<span class="answer-pattern">' + escapeHtml(patternText) + '</span>' +
        '</div>' +
        '<section class="part5-language" aria-label="中文参考答案">' +
          '<p class="part5-language-title">中文参考答案</p>' +
          renderRows(record.answerSectionsZh) +
        '</section>' +
        '<div class="part5-english-toggle-row">' +
          '<button class="tool-button part5-english-toggle" type="button" data-uid="' + escapeAttr(record.uid) + '">' + (englishVisible ? "隐藏英文答案" : "显示英文答案") + '</button>' +
        '</div>' +
        (englishVisible
          ? '<section class="part5-language" aria-label="英文参考答案">' +
              '<div class="part5-language-heading">' +
                '<p class="part5-language-title">英文参考答案</p>' +
                renderCompactSpeechControl(record) +
              '</div>' +
              renderRows(record.answerSectionsEn) +
            '</section>'
          : '') +
      '</div>';
    }

    function annotatePart1Answer(value) {
      const paragraphs = String(value || "").split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const usableParagraphs = paragraphs.length ? paragraphs : ["题库未提供参考答案。"];
      return usableParagraphs.map((paragraph) => annotateParagraph(paragraph)).join("<br>");
    }

    function annotateParagraph(paragraph) {
      const protectedText = protectAbbreviations(paragraph);
      const sentences = protectedText.match(/[^.!?]+[.!?]?/g) || [protectedText];
      return sentences
        .map((sentence) => annotateSentence(sentence.replaceAll("@@DOT@@", ".").trim()))
        .filter(Boolean)
        .join(' <span class="pause-mark">//</span> ');
    }

    function annotateSentence(sentence) {
      if (!sentence) return "";
      const endingMatch = sentence.match(/[.!?]$/);
      const ending = endingMatch ? endingMatch[0] : "";
      const body = ending ? sentence.slice(0, -1).trim() : sentence;
      const pieces = body.split(/([,;:])/);
      let html = "";
      for (const piece of pieces) {
        if (!piece) continue;
        if (piece === "," || piece === ";" || piece === ":") {
          html += escapeHtml(piece) + '<span class="tone-mark tone-rise">↑</span> <span class="pause-mark">/</span> ';
        } else {
          html += highlightReadingStress(piece);
        }
      }
      const finalTone = ending === "?" || !ending ? "↑" : "↓";
      const finalClass = finalTone === "↑" ? "tone-rise" : "tone-fall";
      return html.replace(/\s+/g, " ").trim() + escapeHtml(ending) + '<span class="tone-mark ' + finalClass + '">' + finalTone + '</span>';
    }

    function protectAbbreviations(text) {
      return String(text)
        .replace(/\b(Mr|Ms|Mrs|Dr|Prof|St)\./g, "$1@@DOT@@")
        .replace(/\b([ap])\.m\./gi, (match) => match.replaceAll(".", "@@DOT@@"));
    }

    function highlightReadingStress(text) {
      const tokens = String(text).match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|\d+(?:[:./-]\d+)*(?:\s?(?:a\.m\.|p\.m\.|am|pm))?|[^A-Za-z\d]+/gi) || [String(text)];
      return tokens.map((token) => {
        if (!/[A-Za-z\d]/.test(token)) return escapeHtml(token);
        const normalized = token.toLowerCase().replace(/[’']/g, "'");
        const isNumber = /\d/.test(token);
        const isContraction = normalized.includes("'");
        const isContentWord = isNumber || isContraction || readingAlwaysStressWords.has(normalized) ||
          (!readingFunctionWords.has(normalized) && normalized.length > 2);
        return isContentWord ? '<strong>' + escapeHtml(token) + '</strong>' : escapeHtml(token);
      }).join("");
    }

    async function speakRecord(uid) {
      const record = data.records.find((item) => item.uid === uid) ||
        data.records.flatMap((item) => item.questions || []).find((item) => item.uid === uid);
      if (!record) return;
      const text = String(record.answer || record.prompt || "").replace(/\s+/g, " ").trim();
      if (!text) {
        setSpeechStatus(uid, "没有可朗读文本", "error");
        return;
      }
      if (!supportsSpeechSynthesis()) {
        setSpeechStatus(uid, "当前浏览器不支持朗读", "error");
        return;
      }
      setSpeechStatus(uid, "正在加载英文声音", "");
      const voices = await loadVoices();
      const englishVoices = voices.filter((voice) => /^en/i.test(voice.lang || ""));
      const voice = getEnglishVoice(voices);
      stopSpeech();
      speechUtterance = new window.SpeechSynthesisUtterance(text);
      speechUtterance.lang = "en-US";
      speechUtterance.rate = 0.82;
      speechUtterance.pitch = 1;
      speechUtterance.volume = 1;
      if (voice) speechUtterance.voice = voice;
      let started = false;
      speechUtterance.onstart = () => {
        started = true;
        setSpeechStatus(uid, "正在朗读" + (voice ? " · " + voice.name : ""), "");
      };
      speechUtterance.onend = () => {
        clearSpeechKeepAlive();
        setSpeechStatus(uid, "朗读完成", "");
        speechUtterance = null;
      };
      speechUtterance.onerror = (event) => {
        clearSpeechKeepAlive();
        setSpeechStatus(uid, "朗读失败：" + (event.error || "unknown"), "error");
        speechUtterance = null;
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      window.setTimeout(() => {
        if (!speechUtterance) return;
        window.speechSynthesis.speak(speechUtterance);
        startSpeechKeepAlive();
        window.setTimeout(() => {
          if (!started && window.speechSynthesis.speaking) {
            setSpeechStatus(uid, "已请求播放" + (voice ? " · " + voice.name : ""), "warning");
          } else if (!started && !window.speechSynthesis.speaking) {
            const suffix = englishVoices.length ? "英文声音 " + englishVoices.length + " 个" : "未检测到英文声音";
            setSpeechStatus(uid, "浏览器未开始朗读 · " + suffix, "error");
          }
        }, 1400);
      }, 80);
    }

    function pauseOrResumeSpeech(uid) {
      if (!supportsSpeechSynthesis()) {
        setSpeechStatus(uid, "当前浏览器不支持朗读", "error");
        return;
      }
      if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        setSpeechStatus(uid, "继续朗读", "");
      } else if (window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        setSpeechStatus(uid, "已暂停", "warning");
      } else {
        speakRecord(uid);
      }
    }

    function stopSpeech(uid) {
      clearSpeechKeepAlive();
      if (supportsSpeechSynthesis()) window.speechSynthesis.cancel();
      if (uid) setSpeechStatus(uid, "已停止", "");
      speechUtterance = null;
    }

    async function checkSpeech(uid) {
      if (!supportsSpeechSynthesis()) {
        setSpeechStatus(uid, "当前浏览器不支持朗读", "error");
        return;
      }
      setSpeechStatus(uid, "正在检测声音", "");
      const tonePlayed = await playTestTone();
      const voices = await loadVoices(true);
      const englishVoices = voices.filter((voice) => /^en/i.test(voice.lang || ""));
      if (!tonePlayed) {
        setSpeechStatus(uid, "测试声音失败，请检查浏览器声音权限", "error");
      } else if (englishVoices.length) {
        setSpeechStatus(uid, "检测通过 · 英文声音 " + englishVoices.length + " 个", "");
      } else {
        setSpeechStatus(uid, "系统声音可用，但未加载英文朗读声音", "warning");
      }
    }

    function supportsSpeechSynthesis() {
      return "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance !== "undefined";
    }

    function loadVoices(forceRefresh = false) {
      if (!supportsSpeechSynthesis()) return Promise.resolve([]);
      if (!forceRefresh && voicesReadyPromise) return voicesReadyPromise;
      voicesReadyPromise = new Promise((resolve) => {
        const synth = window.speechSynthesis;
        const existing = synth.getVoices();
        if (existing.length) {
          resolve(existing);
          return;
        }
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          if (typeof synth.removeEventListener === "function") {
            synth.removeEventListener("voiceschanged", finish);
          }
          resolve(synth.getVoices());
        };
        if (typeof synth.addEventListener === "function") {
          synth.addEventListener("voiceschanged", finish);
        } else {
          const previous = synth.onvoiceschanged;
          synth.onvoiceschanged = () => {
            if (typeof previous === "function") previous.call(synth);
            finish();
          };
        }
        window.setTimeout(finish, 1600);
      });
      return voicesReadyPromise;
    }

    function getEnglishVoice(voices) {
      const preferredNames = ["Samantha", "Alex", "Daniel", "Karen", "Moira", "Google US English", "Microsoft Aria"];
      for (const preferredName of preferredNames) {
        const match = voices.find((voice) => voice.name && voice.name.toLowerCase().includes(preferredName.toLowerCase()));
        if (match) return match;
      }
      return voices.find((voice) => /^en-US/i.test(voice.lang || "")) || voices.find((voice) => /^en/i.test(voice.lang || "")) || null;
    }

    function refreshSpeechStatuses() {
      const statusNodes = [...document.querySelectorAll("[data-speech-status]")];
      if (!statusNodes.length) return;
      if (!supportsSpeechSynthesis()) {
        statusNodes.forEach((node) => setSpeechStatus(node.dataset.speechStatus, "当前浏览器不支持朗读", "error"));
        return;
      }
      loadVoices().then((voices) => {
        const englishVoices = voices.filter((voice) => /^en/i.test(voice.lang || ""));
        const message = englishVoices.length ? "可朗读 · 英文声音 " + englishVoices.length + " 个" : "未检测到英文朗读声音";
        const level = englishVoices.length ? "" : "warning";
        statusNodes.forEach((node) => {
          if (["检测中", "未检测到英文朗读声音"].includes(node.textContent) || node.textContent.startsWith("可朗读")) {
            setSpeechStatus(node.dataset.speechStatus, message, level);
          }
        });
      });
    }

    function startSpeechKeepAlive() {
      clearSpeechKeepAlive();
      if (!supportsSpeechSynthesis()) return;
      speechKeepAliveTimer = window.setInterval(() => {
        if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      }, 5000);
    }

    function clearSpeechKeepAlive() {
      if (speechKeepAliveTimer) {
        window.clearInterval(speechKeepAliveTimer);
        speechKeepAliveTimer = 0;
      }
    }

    async function playTestTone() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return false;
      try {
        const context = new AudioContextClass();
        await context.resume();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 660;
        gain.gain.setValueAtTime(0.0001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.12, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.25);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.28);
        window.setTimeout(() => context.close(), 450);
        return true;
      } catch {
        return false;
      }
    }

    function setSpeechStatus(uid, text, level = "") {
      document.querySelectorAll("[data-speech-status]").forEach((node) => {
        if (node.dataset.speechStatus === uid) {
          node.textContent = text;
          node.classList.toggle("warning", level === "warning");
          node.classList.toggle("error", level === "error");
        }
      });
    }

    function renderParts() {
      partList.innerHTML = data.parts.map((part) =>
        '<button class="part-button ' + (part.part === state.part ? "active" : "") + '" type="button" data-part="' + part.part + '">' +
          '<span class="part-title">' + escapeHtml(part.name) + '</span>' +
          '<span class="part-count">' + part.counts.total + '</span>' +
        '</button>'
      ).join("");
    }

    function renderPriorityButtons() {
      priorityList.querySelectorAll(".priority-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.priority === state.priority);
      });
    }

    function renderSummary(records) {
      const part = data.parts.find((item) => item.part === state.part);
      const unit = [3, 4].includes(state.part) ? "套" : "题";
      const visibleCounts = records.reduce((acc, record) => {
        acc[record.priority] += 1;
        return acc;
      }, { P1: 0, P2: 0, P3: 0 });
      summaryStrip.innerHTML = [
        ["全部", part.counts.total, "本 Part 总" + unit + "数"],
        ["P1", visibleCounts.P1, "当前筛选"],
        ["P2", visibleCounts.P2, "当前筛选"],
        ["P3", visibleCounts.P3, "当前筛选"],
      ].map(([label, count, note]) =>
        '<div class="summary-item">' +
          '<span class="summary-number">' + count + '</span>' +
          '<span class="summary-label">' + escapeHtml(label + " " + note) + '</span>' +
        '</div>'
      ).join("");
    }

    function renderPart3Q3Answer(question) {
      const englishVisible = state.part3EnglishOpen.has(question.uid);
      const labels = question.answerPattern === "1R1E"
        ? ["总 · 观点", "分 · 理由", "分 · 例子", "总 · 总结"]
        : ["总 · 观点", "分 · 理由 1", "分 · 理由 2", "总 · 总结"];
      const patternText = question.answerPattern === "1R1E"
        ? "总 + 1 个理由 + 1 个例子 + 总"
        : "总 + 2 个理由 + 总";
      const renderRows = (sections) => sections.map((section, index) =>
        '<div class="part5-answer-row">' +
          '<span class="part5-step-label">' + escapeHtml(labels[index] || "要点") + '</span>' +
          '<p class="part5-step-text">' + escapeHtml(section) + '</p>' +
        '</div>'
      ).join("");
      return '<div class="group-answer part3-q3-answer">' +
        '<div class="part5-answer-heading">' +
          '<p class="answer-title">第 3 题双语参考答案 · 30 秒</p>' +
          '<span class="answer-pattern">' + escapeHtml(patternText) + '</span>' +
        '</div>' +
        '<section class="part5-language" aria-label="中文参考答案">' +
          '<p class="part5-language-title">中文参考答案</p>' +
          renderRows(question.answerSectionsZh) +
        '</section>' +
        '<div class="part5-english-toggle-row">' +
          '<button class="tool-button part3-english-toggle" type="button" data-uid="' + escapeAttr(question.uid) + '">' + (englishVisible ? "隐藏英文答案" : "显示英文答案") + '</button>' +
        '</div>' +
        (englishVisible
          ? '<section class="part5-language" aria-label="英文参考答案">' +
              '<div class="part5-language-heading">' +
                '<p class="part5-language-title">英文参考答案</p>' +
                renderCompactSpeechControl(question) +
              '</div>' +
              renderRows(question.answerSectionsEn) +
            '</section>'
          : '') +
      '</div>';
    }

    function renderGroupedQuestions(record, answerVisible) {
      return '<div class="question-group" aria-label="整组三题">' + record.questions.map((question) => {
        const timerKey = question.uid || record.uid + "::question-" + question.questionId;
        const prepBadge = question.preparationTime
          ? renderCountdown(question.preparationTime, timerKey + "::prep", "准备", "prep")
          : '';
        const answerBadge = question.answerTime
          ? renderCountdown(question.answerTime, timerKey + "::answer", "作答", "answer")
          : '';
        const answer = answerVisible
          ? question.answerSectionsEn && question.answerSectionsZh
            ? renderPart3Q3Answer(question)
            : '<div class="group-answer">' +
              '<div class="answer-heading">' +
                '<p class="answer-title">英文参考答案 · ' + escapeHtml(question.answerTime || "--") + ' 秒</p>' +
                renderCompactSpeechControl(question) +
              '</div>' +
              '<p class="answer-text">' + escapeHtml(question.answer || "题库未提供参考答案。") + '</p>' +
            '</div>'
          : '';
        return '<section class="group-question">' +
          '<div class="group-question-head">' +
            '<span class="badge meta">题' + escapeHtml(question.questionId) + '</span>' +
            prepBadge +
            answerBadge +
            (question.topic ? '<span class="group-question-topic">' + escapeHtml(question.topic) + '</span>' : '') +
          '</div>' +
          '<p class="question-text">' + escapeHtml(question.prompt) + '</p>' +
          answer +
        '</section>';
      }).join('') + '</div>';
    }

    function renderMaterial(record) {
      if (record.part !== 4 || !record.material) return "";
      if (record.material.missing) {
        return '<div class="material material-missing">原始题库未收录本题资料表。</div>';
      }
      const head = '<thead><tr>' + record.material.headers.map((header) =>
        '<th scope="col">' + escapeHtml(header) + '</th>'
      ).join("") + '</tr></thead>';
      const body = '<tbody>' + record.material.rows.map((row) =>
        '<tr class="' + escapeAttr(row.status || "") + '">' + row.cells.map((cell) =>
          '<td>' + escapeHtml(cell) + '</td>'
        ).join("") + '</tr>'
      ).join("") + '</tbody>';
      const notes = record.material.notes?.length
        ? '<p class="material-notes">补充信息：' + escapeHtml(record.material.notes.join("；")) + '</p>'
        : "";
      return '<details class="material" open><summary>资料表</summary>' +
        '<div class="material-scroll"><table class="material-table">' + head + body + '</table></div>' +
        notes +
      '</details>';
    }

    function renderCards(records) {
      if (!records.length) {
        cardList.innerHTML = '<div class="empty">没有匹配的题目。</div>';
        return;
      }
      cardList.innerHTML = records.map((record, index) => {
        const answerVisible = state.showAllAnswers || state.answerOpen.has(record.uid);
        const isGrouped = Array.isArray(record.questions) && record.questions.length > 0;
        const isDone = state.done.has(record.uid);
        const isPersonalized = state.personalized.has(record.uid);
        const material = renderMaterial(record);
        const image = record.imagePath
          ? '<div class="image-wrap"><img src="' + escapeAttr(record.imagePath) + '" alt="' + escapeAttr(record.topic || "Part2 图片") + '" loading="lazy" /></div>'
          : "";
        const answer = !isGrouped && answerVisible
          ? renderAnswer(record)
          : "";
        const questionContent = isGrouped
          ? renderGroupedQuestions(record, answerVisible)
          : '<p class="question-text">' + escapeHtml(record.prompt) + '</p>';
        const questionBadge = isGrouped
          ? '<span class="badge meta">' + record.questions.length + ' 题一组</span>'
          : '<span class="badge meta">题' + escapeHtml(record.questionId) + '</span>';
        const reviewBadge = record.reviewTime ? '<span class="badge meta">看表 ' + escapeHtml(record.reviewTime) + 's</span>' : "";
        const prepBadge = record.preparationTime ? renderCountdown(record.preparationTime, record.uid + "::prep", "准备", "prep") : "";
        const answerBadge = record.answerTime ? renderCountdown(record.answerTime, record.uid + "::answer", "作答", "answer") : "";
        const imageOnLeft = record.part === 2 && Boolean(image);
        const cardContent = '<div>' +
          '<div class="card-head">' +
            '<span class="badge ' + record.priority.toLowerCase() + '">' + record.priority + '</span>' +
            '<span class="badge meta">#' + (index + 1) + '</span>' +
            '<span class="badge meta">' + escapeHtml(record.sourceFile) + '</span>' +
            questionBadge +
            reviewBadge +
            prepBadge +
            answerBadge +
          '</div>' +
          '<h3 class="card-topic">' + escapeHtml(record.topic || record.partName) + '</h3>' +
          material +
          questionContent +
          answer +
          '<div class="card-actions">' +
            '<button class="tool-button answer-toggle" type="button" data-uid="' + escapeAttr(record.uid) + '">' + (answerVisible ? (isGrouped ? "隐藏整组答案" : "隐藏答案") : (isGrouped ? "显示整组答案" : "显示答案")) + '</button>' +
            '<button class="tool-button done-toggle ' + (isDone ? "done" : "") + '" type="button" data-uid="' + escapeAttr(record.uid) + '">' + (isDone ? "已练" : "标记已练") + '</button>' +
            '<button class="tool-button personalize-toggle ' + (isPersonalized ? "personalized" : "") + '" type="button" data-uid="' + escapeAttr(record.uid) + '">' + (isPersonalized ? "已个性化" : "标记个性化") + '</button>' +
          '</div>' +
        '</div>';
        return '<article class="question-card" data-uid="' + escapeAttr(record.uid) + '">' +
          '<div class="card-main ' + (image ? "" : "no-image") + (imageOnLeft ? " part2-image-left" : "") + '">' +
            (imageOnLeft ? image : "") +
            cardContent +
            (imageOnLeft ? "" : image) +
          '</div>' +
          '<div class="reason">' + escapeHtml(record.reason) + '</div>' +
        '</article>';
      }).join("");
    }

    function render() {
      const records = currentRecords();
      const part = data.parts.find((item) => item.part === state.part);
      const unit = [3, 4].includes(state.part) ? "套" : "道";
      $("currentTitle").textContent = part.name;
      $("currentMeta").textContent = records.length + " " + unit + "显示中；P1 " + part.counts.P1 + "，P2 " + part.counts.P2 + "，P3 " + part.counts.P3;
      $("totalCount").textContent = part.counts.total;
      const partRecords = data.records.filter((record) => record.part === state.part);
      const doneCount = partRecords.filter((record) => state.done.has(record.uid)).length;
      $("doneCount").textContent = doneCount;
      $("undoneCount").textContent = partRecords.length - doneCount;
      $("personalizedCount").textContent = partRecords.filter((record) => state.personalized.has(record.uid)).length;
      $("shownCount").textContent = records.length;
      document.querySelectorAll("[data-study-filter]").forEach((button) => {
        const active = button.dataset.studyFilter === state.studyFilter;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      $("toggleAnswers").textContent = state.showAllAnswers ? "隐藏全部答案" : "显示全部答案";
      $("shuffleButton").textContent = state.shuffled ? "恢复排序" : "随机排序";
      renderParts();
      renderPriorityButtons();
      renderSummary(records);
      renderCards(records);
      refreshSpeechStatuses();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[\\^$.*+?()[\]{}|]/g, "\\$&");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll(String.fromCharCode(96), "&#096;");
    }

    partList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-part]");
      if (!button) return;
      stopSpeech();
      state.part = Number(button.dataset.part);
      state.answerOpen.clear();
      state.part3EnglishOpen.clear();
      state.part5EnglishOpen.clear();
      render();
    });

    priorityList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-priority]");
      if (!button) return;
      state.priority = button.dataset.priority;
      render();
    });

    searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });

    document.querySelector(".sidebar-stats").addEventListener("click", (event) => {
      const button = event.target.closest("[data-study-filter]");
      if (!button) return;
      state.studyFilter = button.dataset.studyFilter === state.studyFilter && state.studyFilter !== "all"
        ? "all"
        : button.dataset.studyFilter;
      render();
    });

    cardList.addEventListener("click", (event) => {
      const countdownToggle = event.target.closest("[data-countdown-toggle]");
      if (countdownToggle) {
        toggleCountdown(countdownToggle.dataset.countdownToggle);
        return;
      }
      const countdownReset = event.target.closest("[data-countdown-reset]");
      if (countdownReset) {
        resetCountdown(countdownReset.dataset.countdownReset);
        return;
      }
      const checkSpeechButton = event.target.closest("[data-check-speech]");
      if (checkSpeechButton) {
        checkSpeech(checkSpeechButton.dataset.checkSpeech);
        return;
      }
      const speakButton = event.target.closest("[data-speak]");
      if (speakButton) {
        speakRecord(speakButton.dataset.speak);
        return;
      }
      const pauseSpeechButton = event.target.closest("[data-pause-speech]");
      if (pauseSpeechButton) {
        pauseOrResumeSpeech(pauseSpeechButton.dataset.pauseSpeech);
        return;
      }
      const stopSpeechButton = event.target.closest("[data-stop-speech]");
      if (stopSpeechButton) {
        stopSpeech(stopSpeechButton.dataset.stopSpeech);
        return;
      }
      const part5EnglishButton = event.target.closest(".part5-english-toggle");
      if (part5EnglishButton) {
        const uid = part5EnglishButton.dataset.uid;
        if (state.part5EnglishOpen.has(uid)) state.part5EnglishOpen.delete(uid);
        else state.part5EnglishOpen.add(uid);
        render();
        return;
      }
      const part3EnglishButton = event.target.closest(".part3-english-toggle");
      if (part3EnglishButton) {
        const uid = part3EnglishButton.dataset.uid;
        if (state.part3EnglishOpen.has(uid)) state.part3EnglishOpen.delete(uid);
        else state.part3EnglishOpen.add(uid);
        render();
        return;
      }
      const answerButton = event.target.closest(".answer-toggle");
      if (answerButton) {
        const uid = answerButton.dataset.uid;
        stopSpeech(uid);
        if (state.answerOpen.has(uid)) {
          state.answerOpen.delete(uid);
          state.part3EnglishOpen.clear();
          state.part5EnglishOpen.delete(uid);
        } else state.answerOpen.add(uid);
        render();
        return;
      }
      const doneButton = event.target.closest(".done-toggle");
      if (doneButton) {
        const uid = doneButton.dataset.uid;
        if (state.done.has(uid)) state.done.delete(uid);
        else state.done.add(uid);
        saveDone();
        render();
        return;
      }
      const personalizeButton = event.target.closest(".personalize-toggle");
      if (personalizeButton) {
        const uid = personalizeButton.dataset.uid;
        if (state.personalized.has(uid)) state.personalized.delete(uid);
        else state.personalized.add(uid);
        savePersonalized();
        render();
      }
    });

    $("toggleAnswers").addEventListener("click", () => {
      stopSpeech();
      state.showAllAnswers = !state.showAllAnswers;
      state.part3EnglishOpen.clear();
      state.part5EnglishOpen.clear();
      render();
    });

    $("shuffleButton").addEventListener("click", () => {
      if (state.shuffled) {
        state.shuffled = false;
        state.shuffleSeed = "";
      } else {
        state.shuffled = true;
        state.shuffleSeed = createShuffleSeed();
      }
      render();
    });

    $("resetDone").addEventListener("click", () => {
      state.done.clear();
      saveDone();
      render();
    });

    if (supportsSpeechSynthesis()) {
      window.speechSynthesis.getVoices();
      if (typeof window.speechSynthesis.addEventListener === "function") {
        window.speechSynthesis.addEventListener("voiceschanged", () => {
          voicesReadyPromise = null;
          refreshSpeechStatuses();
        });
      }
    }

    render();
    updateAllCountdowns();
    window.setInterval(updateAllCountdowns, 200);
  </script>
</body>
</html>
